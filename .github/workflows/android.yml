name: LK Qwen Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '*.gradle'
      - '.github/workflows/android.yml'
permissions:
  contents: write
concurrency:
  group: lkqwen-android-main
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Android SDK and NDK
        run: |
          command -v sdkmanager
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
      - name: Build native ARM64 inference engine
        run: |
          git clone --depth 1 --branch b12249 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama"
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S "$RUNNER_TEMP/llama" -B "$RUNNER_TEMP/native" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DGGML_NATIVE=OFF -DGGML_CPU_ARM_ARCH=armv8-a -DGGML_CPU_ALL_VARIANTS=OFF \
            -DGGML_BACKEND_DL=OFF -DGGML_OPENMP=OFF -DGGML_LLAMAFILE=OFF \
            -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON
          cmake --build "$RUNNER_TEMP/native" --target llama-server -j 2
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp "$RUNNER_TEMP/native/bin/llama-server" app/src/main/jniLibs/arm64-v8a/liblkqwen.so
          cp "$RUNNER_TEMP/llama/LICENSE" app/src/main/assets/llama-cpp-LICENSE.txt
          file app/src/main/jniLibs/arm64-v8a/liblkqwen.so
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -d app/src/main/jniLibs/arm64-v8a/liblkqwen.so
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/liblkqwen.so'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          mkdir -p dist
          cp "$APK" dist/LKQwen-0.1.0-alpha.apk
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LKQwen-Android-ARM64
          path: dist/
          if-no-files-found: error
      - name: Publish direct APK download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=v0.1.0-alpha
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/LKQwen-0.1.0-alpha.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/LKQwen-0.1.0-alpha.apk dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "LK Qwen 0.1.0 Alpha" \
              --notes "ARM64 Android test APK. Qwen model is downloaded separately on first use. Device testing pending." --prerelease
          fi
